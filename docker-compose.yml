# PostgreSQL for local development:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: sentinex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinex
      POSTGRES_PASSWORD: sentinex
      POSTGRES_DB: sentinex
    ports:
      - "5432:5432"
    volumes:
      - sentinex-data:/var/lib/postgresql/data

volumes:
  sentinex-data:
